name: OpenWrt 25.12 x86_64 Builder v2

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: OpenWrt release tag (example v25.12.6)
        required: true
        default: v25.12.6
      jobs:
        description: Parallel compile jobs (keep low on GitHub hosted runners)
        required: true
        default: "2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: ./build.sh deps
      - name: Build firmware
        env:
          OPENWRT_BRANCH: ${{ inputs.openwrt_branch }}
          JOBS: ${{ inputs.jobs }}
        run: ./build.sh build
      - name: Upload firmware and checksums
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-x86_64-v2
          path: output/*
          if-no-files-found: error
          retention-days: 14
