name: Build OpenWrt 25.12 x86_64

on:
  workflow_dispatch:
    inputs:
      profile:
        description: x86_64 image profile
        required: true
        type: choice
        options: [generic, legacy]
        default: generic
      image_size:
        description: Root filesystem size (MB)
        required: true
        default: "1024"
      hostname:
        description: Default router hostname
        required: true
        default: OpenWrt
      openwrt_branch:
        description: OpenWrt branch or tag
        required: true
        default: openwrt-25.12
      packages:
        description: Space-separated package names
        required: false
        default: "luci luci-ssl kmod-e1000e kmod-igb kmod-ixgbe kmod-r8169 kmod-usb3 usbutils curl ca-bundle htop nano"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            xsltproc qemu-utils libelf-dev ccache

      - name: Build firmware
        env:
          PROFILE: ${{ inputs.profile }}
          IMAGE_SIZE: ${{ inputs.image_size }}
          HOSTNAME: ${{ inputs.hostname }}
          OPENWRT_BRANCH: ${{ inputs.openwrt_branch }}
          PACKAGES: ${{ inputs.packages }}
          JOBS: "2"
        run: ./build.sh build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-x86_64-${{ inputs.profile }}
          path: output/*
          if-no-files-found: error
          retention-days: 14
